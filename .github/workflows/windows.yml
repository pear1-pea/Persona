name: Windows validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-windows:
    name: Windows build + unit tests (manual)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and JVM tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci/windows -Force | Out-Null
          $failed = $false
          python tools/ci/environment.py --android --output build/ci/windows/environment.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($task in @('assembleDebug', 'assembleDebugAndroidTest', 'testDebugUnitTest')) {
            $LASTEXITCODE = $null
            try {
              $ErrorActionPreference = 'Continue'
              & .\gradlew.bat $task --stacktrace --console=plain 2>&1 | Tee-Object -FilePath "build/ci/windows/$task.log"
              if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { $failed = $true }
            } catch {
              $failed = $true
            } finally {
              $ErrorActionPreference = 'Stop'
            }
          }
          if ($failed) { exit 1 }

      - name: Validate JVM evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python tools/ci/check_junit.py app/build/test-results/testDebugUnitTest --output build/ci/windows/junit-summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-reports
          path: |
            build/ci/windows/
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
