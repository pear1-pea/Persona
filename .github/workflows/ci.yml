name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          mkdir -p build/ci/android
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/android/gradle.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
            build/ci/android/
          if-no-files-found: ignore

  backend:
    name: Backend typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: mkdir -p ../build/ci/backend
      - run: npm ci 2>&1 | tee ../build/ci/backend/install.log
      - run: npm run typecheck 2>&1 | tee ../build/ci/backend/typecheck.log
      - run: npm test 2>&1 | tee ../build/ci/backend/tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-logs
          path: build/ci/backend/
          if-no-files-found: ignore

  packager:
    name: Model packager tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p build/ci/packager
      - run: python -B -m unittest discover -s tools/model-packager/tests -v 2>&1 | tee build/ci/packager/tests.log
      - run: python -B tools/model-packager/validate_package.py tools/model-packager/examples/minimal-fixture --require-ready 2>&1 | tee build/ci/packager/validation.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-logs
          path: build/ci/packager/
          if-no-files-found: ignore

  backend-integration:
    name: Backend auth/persona smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: persona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/persona
      PORT: 8080
      TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run smoke test
        working-directory: backend
        run: |
          mkdir -p ../build/ci/backend-integration
          npm ci 2>&1 | tee ../build/ci/backend-integration/install.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql 2>&1 | tee ../build/ci/backend-integration/schema.log
          npx tsx src/server.ts > ../build/ci/backend-integration/server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          PERSONA_BACKEND_BASE_URL=http://127.0.0.1:8080 npm run smoke 2>&1 | tee ../build/ci/backend-integration/smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-logs
          path: build/ci/backend-integration/
          if-no-files-found: ignore

  android-windows:
    name: Windows build + unit tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          ("y`n" * 50) | sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit 1 }
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and JVM tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci/windows -Force | Out-Null
          $failed = $false
          foreach ($task in @('assembleDebug', 'testDebugUnitTest')) {
            $LASTEXITCODE = $null
            try {
              $ErrorActionPreference = 'Continue'
              & .\gradlew.bat $task --stacktrace --console=plain 2>&1 | Tee-Object -FilePath "build/ci/windows/$task.log"
              if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { $failed = $true }
            } catch {
              $failed = $true
            } finally {
              $ErrorActionPreference = 'Stop'
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reports
          path: |
            build/ci/windows/
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: ignore
