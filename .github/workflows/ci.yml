name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inference-eval:
    name: Inference telemetry Python contract (synthetic, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run inference telemetry contract tests
        run: python -B -m unittest discover -s tools/inference-eval/tests -v
      - name: Check synthetic CLI examples
        run: python -B tools/inference-eval/check_fixture.py
      - name: Check candidate preparation contracts (synthetic, no model)
        run: python -B -m unittest discover -s tools/model-candidate/tests -v
      - name: Check Release artifact inspector contracts
        run: python -B -m unittest discover -s tools/release/tests -v

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          mkdir -p build/ci/android
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/android/gradle.log

      - name: Compile unsigned Release and test Release guards
        run: |
          ./gradlew assembleRelease bundleRelease testReleaseUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/android/release-gradle.log

      - name: Inspect Release native compatibility
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tools/release/check_apk.py "$apk" --source-revision "$GITHUB_SHA" --output build/ci/android/release-inspection.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" > build/ci/android/release-zipalign.log
          tail -n 1 build/ci/android/release-zipalign.log

      - name: Retain unsigned Release for inspection
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-not-for-installation
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
            build/ci/android/
          if-no-files-found: ignore

  backend:
    name: Backend typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: mkdir -p ../build/ci/backend
      - run: node --version && npm --version
      - run: npm ci 2>&1 | tee ../build/ci/backend/install.log
      - run: npm audit --omit=dev --audit-level=high 2>&1 | tee ../build/ci/backend/audit.log
      - run: npm run typecheck 2>&1 | tee ../build/ci/backend/typecheck.log
      - run: npm test 2>&1 | tee ../build/ci/backend/tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-logs
          path: build/ci/backend/
          if-no-files-found: ignore

  packager:
    name: Model packager tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p build/ci/packager
      - run: python -B -m unittest discover -s tools/model-packager/tests -v 2>&1 | tee build/ci/packager/tests.log
      - run: python -B tools/model-packager/validate_package.py tools/model-packager/examples/minimal-fixture --require-ready 2>&1 | tee build/ci/packager/validation.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-logs
          path: build/ci/packager/
          if-no-files-found: ignore

  persona-eval:
    name: Persona synthetic evaluation contract (no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p build/ci/persona-eval
      - run: python -B tools/persona-eval/evaluate.py validate 2>&1 | tee build/ci/persona-eval/schema.log
      - run: python -B -m unittest discover -s tools/persona-eval/tests -v 2>&1 | tee build/ci/persona-eval/tests.log
      - run: python -B tools/persona-eval/evaluate.py reference --split all 2>&1 | tee build/ci/persona-eval/reference.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-eval-logs
          path: build/ci/persona-eval/
          if-no-files-found: ignore

  backend-integration:
    name: Backend chat integration + auth/persona smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: persona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/persona
      PORT: 8080
      TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run smoke test
        working-directory: backend
        run: |
          mkdir -p ../build/ci/backend-integration
          node --version
          npm --version
          npm ci 2>&1 | tee ../build/ci/backend-integration/install.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql 2>&1 | tee ../build/ci/backend-integration/schema.log
          TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration 2>&1 | tee ../build/ci/backend-integration/chat-tests.log
          npx tsx src/server.ts > ../build/ci/backend-integration/server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          PERSONA_BACKEND_BASE_URL=http://127.0.0.1:8080 npm run smoke 2>&1 | tee ../build/ci/backend-integration/smoke.log

      - name: Verify Node 24 backend container
        working-directory: backend
        run: |
          logs=../build/ci/backend-integration
          node_version=$(cat ../.nvmrc)
          docker pull "node:${node_version}-bookworm-slim" 2>&1 | tee "$logs/container-base.log"
          docker image inspect "node:${node_version}-bookworm-slim" --format '{{json .RepoDigests}}' > "$logs/container-base-digest.json"
          docker build --tag persona-backend:ci . 2>&1 | tee "$logs/container-build.log"
          cleanup() {
            docker logs persona-backend-ci > "$logs/container-server.log" 2>&1 || true
            docker rm --force persona-backend-ci > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name persona-backend-ci --network host \
            --env DATABASE_URL --env TRUST_PROXY --env PORT=8081 persona-backend:ci
          docker exec persona-backend-ci node --version | tee "$logs/container-node.log"
          docker exec persona-backend-ci npm --version | tee "$logs/container-npm.log"
          test "$(docker exec persona-backend-ci node --version)" = "v${node_version}"
          ready=false
          for i in {1..30}; do
            if curl --max-time 2 -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' persona-backend-ci)" != true ]; then
              break
            fi
            sleep 1
          done
          test "$ready" = true
          PERSONA_BACKEND_BASE_URL=http://127.0.0.1:8081 npm run smoke 2>&1 | tee "$logs/container-smoke.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-logs
          path: build/ci/backend-integration/
          if-no-files-found: ignore

  android-windows:
    name: Windows build + unit tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          ("y`n" * 50) | sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit 1 }
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and JVM tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci/windows -Force | Out-Null
          $failed = $false
          foreach ($task in @('assembleDebug', 'assembleDebugAndroidTest', 'testDebugUnitTest')) {
            $LASTEXITCODE = $null
            try {
              $ErrorActionPreference = 'Continue'
              & .\gradlew.bat $task --stacktrace --console=plain 2>&1 | Tee-Object -FilePath "build/ci/windows/$task.log"
              if ($null -eq $LASTEXITCODE -or $LASTEXITCODE -ne 0) { $failed = $true }
            } catch {
              $failed = $true
            } finally {
              $ErrorActionPreference = 'Stop'
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reports
          path: |
            build/ci/windows/
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: ignore
